<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sorteio de Alcoolemia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f2f2f2;
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #0077cc;
      color: white;
      border-radius: 5px;
      margin: 5px;
    }

    button:hover {
      background-color: #005fa3;
    }

    #resultado {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }

    .historico-item {
      background: #fff;
      padding: 10px;
      margin: 10px auto;
      border-radius: 5px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }
  </style>
</head>

<body>

  <h2>Sorteio de Alcoolemia</h2>

  <button onclick="sortear()">Sortear</button>

  <div id="resultado"></div>

  <hr>

  <h3>Histórico de Sorteios</h3>
  <div id="listaHistorico"></div>

  <button onclick="limparHistorico()">Limpar Histórico</button>

  <script>
    const nomes = [
      "MARCO ANTONIO CAMPOS GOMES",
      "HEVERTON APARECIDO TIBURSKI",
      "MARCOS MARTINELLI NETO",
      "EVERALDO DA SILVA PEREIRA",
      "MAGNA PEREIRA DA SILVA",
      "PATRICIA APARECIDA BRANDAO",
      "JOENIL MARQUES RIBEIRO",
      "ANTONIO MESQUITA S JUNIOR",
      "FRANCISCO CARLOS ABSOLON SOARES",
      "JAIRO JOSE DA SILVA AMORIM"
      // (mantive só alguns para exemplo — você pode colar todos novamente aqui)
    ];

    function sortear() {
      const sorteado = nomes[Math.floor(Math.random() * nomes.length)];

      document.getElementById("resultado").innerText =
        "Selecionado para alcoolemia: " + sorteado;

      salvarHistorico(sorteado);
    }

    function salvarHistorico(sorteado) {
      const historico = JSON.parse(localStorage.getItem("historicoSorteios")) || [];

      const novoRegistro = {
        data: new Date().toLocaleString(),
        sorteado: sorteado
      };

      historico.push(novoRegistro);

      localStorage.setItem("historicoSorteios", JSON.stringify(historico));

      carregarHistorico();
    }

    function carregarHistorico() {
      const historico = JSON.parse(localStorage.getItem("historicoSorteios")) || [];
      const div = document.getElementById("listaHistorico");

      div.innerHTML = "";

      historico.forEach((item, index) => {
        div.innerHTML += `
          <div class="historico-item">
            <strong>Sorteio ${index + 1}</strong><br>
            Data: ${item.data}<br>
            Selecionado: ${item.sorteado}
          </div>
        `;
      });
    }

    function limparHistorico() {
      if (confirm("Deseja apagar todo o histórico?")) {
        localStorage.removeItem("historicoSorteios");
        carregarHistorico();
      }
    }

    window.onload = function() {
      carregarHistorico();
    };
  </script>

</body>
</html>
