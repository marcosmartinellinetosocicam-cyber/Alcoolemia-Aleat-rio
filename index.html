    ========================= */

       HISTÓRICO
    ========================= */

       ERRO LOGIN
    ========================= */

    }

       STATUS
    ========================= */

      margin-top: 10px;
      font-size: 14px;

    /* =========================================
       SORTEAR
    ========================================== */

    async function sortear() {

      const botao =
        document.getElementById(
          "botaoSortear"
        );


      botao.disabled = true;

      botao.innerText =
        "REGISTRANDO...";


      const indice =
        Math.floor(
          Math.random() * nomes.length
        );


      const sorteado =
        nomes[indice];


      document.getElementById(
        "resultado"
      ).innerHTML =
        "<small>SELECIONADO:</small><br>" +
        sorteado;


      const sucesso =
        await salvarHistorico(
          sorteado
        );


      if (sucesso) {

        document.getElementById(
          "status"
        ).innerText =
          "✓ Sorteio registrado na planilha online.";


        await atualizarHistorico();

      }

      else {

        document.getElementById(
          "status"
        ).innerText =
          "⚠ Sorteio realizado, mas não foi registrado online.";

      }


      botao.disabled = false;

      botao.innerText =
        "Sortear Nome";

    }


    /* =========================================
       SALVAR NO GOOGLE SHEETS
    ========================================== */

    async function salvarHistorico(nome) {

      try {

        const resposta =
          await fetch(
            URL_APPS_SCRIPT,
            {
              method: "POST",

              body: JSON.stringify({

                nome: nome,

                unidade: UNIDADE

              })

            }
          );


        const resultado =
          await resposta.json();


        if (
          resultado.sucesso
        ) {

          console.log(
            "Sorteio registrado online:",
            resultado.numero
          );


          return true;

        }


        console.error(
          "Erro:",
          resultado.erro
        );


        return false;


      }

      catch (erro) {

        console.error(
          "Erro ao enviar para a planilha:",
          erro
        );


        alert(
          "O sorteio foi realizado, mas não foi possível registrar na planilha online."
        );


        return false;

      }

    }


    /* =========================================
       BUSCAR HISTÓRICO ONLINE
    ========================================== */

    async function atualizarHistorico() {

      const div =
        document.getElementById(
          "listaHistorico"
        );


      div.innerHTML =
        "<div class='historico-item'>Carregando histórico...</div>";


      try {

        const resposta =
          await fetch(
            URL_APPS_SCRIPT
          );


        const historico =
          await resposta.json();


        div.innerHTML = "";


        if (
          !Array.isArray(
            historico
          ) ||
          historico.length === 0
        ) {

          div.innerHTML =
            "<div class='historico-item'>Nenhum sorteio realizado ainda.</div>";


          document.getElementById(
            "status"
          ).innerText =
            "✓ Conectado à planilha online.";

          return;

        }


        [
          ...historico
        ]
        .reverse()
        .forEach(
          function(item) {

            div.innerHTML += `

              <div class="historico-item">

                <strong>
                  Sorteio #${item.numero}
                </strong>

                <br>

                📅 Data:
                ${item.data}

                <br>

                🕐 Hora:
                ${item.hora}

                <br>

                👤 Nome:
                <strong>
                  ${item.sorteado}
                </strong>

                <br>

                🏢 Unidade:
                ${item.unidade}

              </div>

            `;

          }
        );


        document.getElementById(
          "status"
        ).innerText =
          "✓ Histórico online atualizado.";

      }

      catch (erro) {

        console.error(
          "Erro ao carregar histórico:",
          erro
        );


        div.innerHTML =
          "<div class='historico-item'>Não foi possível carregar o histórico online.</div>";


        document.getElementById(
          "status"
        ).innerText =
          "⚠ Erro ao conectar com a planilha.";

      }

    }


    /* =========================================
       MOSTRAR / OCULTAR HISTÓRICO
    ========================================== */

    function toggleHistorico() {

      const div =
        document.getElementById(
          "listaHistorico"
        );


      if (
        div.style.display === "none" ||
        div.style.display === ""
      ) {

        div.style.display =
          "block";


        atualizarHistorico();

      }

      else {

        div.style.display =
          "none";

      }

    }


    /* =========================================
       BAIXAR CSV
    ========================================== */

    async function baixarCSV() {

      try {

        const resposta =
          await fetch(
            URL_APPS_SCRIPT
          );


        const historico =
          await resposta.json();


        if (
          !Array.isArray(
            historico
          ) ||
          historico.length === 0
        ) {

          alert(
            "Não há dados para baixar!"
          );

          return;

        }


        let csv =
          "Numero,Data,Hora,Selecionado,Unidade\n";


        historico.forEach(
          function(item) {

            csv +=
              `${item.numero},"${item.data}","${item.hora}","${item.sorteado}","${item.unidade}"\n`;

          }
        );


        const blob =
          new Blob(
            [
              "\ufeff" + csv
            ],
            {
              type:
                "text/csv;charset=utf-8;"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const a =
          document.createElement(
            "a"
          );


        a.href =
          url;


        a.download =
          "relatorio_alcoolemia_VG.csv";


        document.body.appendChild(
          a
        );


        a.click();


        document.body.removeChild(
          a
        );


        URL.revokeObjectURL(
          url
        );

      }

      catch (erro) {

        console.error(
          erro
        );


        alert(
          "Não foi possível gerar o relatório."
        );

      }

    }


    /* =========================================
       LIMPAR HISTÓRICO
    ========================================== */

          e.key === "Enter"
        ) {
